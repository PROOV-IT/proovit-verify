name: Build ProovIT Verify

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: proovit-verify-linux-x64
            binary: proovit-verify
          - os: windows-latest
            artifact: proovit-verify-windows-x64
            binary: proovit-verify.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: pyinstaller --clean --onefile --name proovit-verify proovit_verify.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.binary }}
