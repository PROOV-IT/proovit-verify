name: Build ProovIT Verify

on:
  workflow_dispatch:

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/validate_docs.py
      - run: python -m py_compile proovit_verify.py scripts/validate_docs.py

  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: proovit-verify-linux-x64
            binary: proovit-verify
          - os: windows-latest
            artifact: proovit-verify-windows-x64
            binary: proovit-verify.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: pyinstaller --clean --onefile --name proovit-verify proovit_verify.py
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.binary }}
