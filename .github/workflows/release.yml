name: Release ProovIT Verify

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, for example v0.1.0'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: proovit-verify-linux-x64
            binary: proovit-verify-linux-x64.tar.gz
          - os: windows-latest
            artifact: proovit-verify-windows-x64
            binary: proovit-verify-windows-x64.exe
            architecture: x64
          - os: windows-latest
            artifact: proovit-verify-windows-x86
            binary: proovit-verify-windows-x86.exe
            architecture: x86
          - os: windows-11-arm
            artifact: proovit-verify-windows-arm64
            binary: proovit-verify-windows-arm64.exe
            architecture: arm64
          - os: macos-13
            artifact: proovit-verify-macos-x64
            binary: proovit-verify-macos-x64.tar.gz
            architecture: x64
          - os: macos-14
            artifact: proovit-verify-macos-arm64
            binary: proovit-verify-macos-arm64.tar.gz
            architecture: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture || 'x64' }}

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller --clean --onefile --name proovit-verify proovit_verify.py

      - name: Rename Linux executable
        if: runner.os == 'Linux'
        run: |
          mv dist/proovit-verify dist/proovit-verify-linux-x64
          chmod +x dist/proovit-verify-linux-x64
          mkdir -p package/proovit-verify-linux-x64
          cp dist/proovit-verify-linux-x64 package/proovit-verify-linux-x64/proovit-verify
          tar -czf dist/proovit-verify-linux-x64.tar.gz -C package proovit-verify-linux-x64

      - name: Package macOS executable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          chmod +x dist/proovit-verify
          mv dist/proovit-verify dist/proovit-verify-macos-${{ matrix.architecture }}
          tar -czf dist/proovit-verify-macos-${{ matrix.architecture }}.tar.gz -C dist proovit-verify-macos-${{ matrix.architecture }}

      - name: Rename Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Rename-Item dist/proovit-verify.exe $env:BINARY_NAME
        env:
          BINARY_NAME: ${{ matrix.binary }}

      - name: Upload release asset
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.binary }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "tag=${INPUT_TAG:-$REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ProovIT Verify ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          body: |
            ## ProovIT Verify ${{ steps.tag.outputs.tag }}

            Independent verifier for ProovIT portable digital evidence archives.

            ### Downloads

            - `proovit-verify-linux-x64.tar.gz` — Linux 64-bit (permission d’exécution incluse)
            - `proovit-verify-windows-x64.exe` — Windows 64-bit Intel/AMD
            - `proovit-verify-windows-x86.exe` — Windows 32-bit Intel/AMD
            - `proovit-verify-windows-arm64.exe` — Windows ARM64
            - `proovit-verify-macos-x64.tar.gz` — macOS Intel
            - `proovit-verify-macos-arm64.tar.gz` — macOS Apple Silicon

            ### Linux usage

            ```bash
            tar -xzf proovit-verify-linux-x64.tar.gz
            ./proovit-verify-linux-x64/proovit-verify preuve.zip --password "CODE"
            ```

            ### Windows usage

            ```powershell
            .\\proovit-verify-windows-x64.exe preuve.zip --password "CODE"
            ```

            Choose the Windows executable matching the architecture of the computer.

            The verifier checks archive integrity, file SHA-256 hashes,
            manifest canonicalization, Ed25519 signatures and blockchain receipts.
          files: release-assets/*
