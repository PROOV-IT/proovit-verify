name: Release ProovIT Verify

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, for example v0.1.0'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: proovit-verify-linux-x64
            binary: proovit-verify-linux-x64
          - os: windows-latest
            artifact: proovit-verify-windows-x64
            binary: proovit-verify-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller --clean --onefile --name proovit-verify proovit_verify.py

      - name: Rename Linux executable
        if: runner.os == 'Linux'
        run: mv dist/proovit-verify dist/proovit-verify-linux-x64

      - name: Rename Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Rename-Item dist/proovit-verify.exe proovit-verify-windows-x64.exe

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.binary }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "tag=${INPUT_TAG:-$REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ProovIT Verify ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          body: |
            ## ProovIT Verify ${{ steps.tag.outputs.tag }}

            Independent verifier for ProovIT portable digital evidence archives.

            ### Downloads

            - `proovit-verify-linux-x64` — Linux 64-bit
            - `proovit-verify-windows-x64.exe` — Windows 64-bit

            ### Usage

            ```bash
            proovit-verify preuve.zip --password "CODE"
            ```

            The verifier checks archive integrity, file SHA-256 hashes,
            manifest canonicalization, Ed25519 signatures and blockchain receipts.
          files: release-assets/*
